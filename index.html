<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>माज़दा पंप हिसाब</title>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="पंप हिसाब">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b3d91">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <div style="padding:40px 20px; text-align:center; font-family:sans-serif;">
    <h2 style="color:#0b3d91; margin-bottom:12px;">माज़दा ऑयल कंपनी</h2>
    <p id="loading-text" style="color:#666; font-size:16px;">लोड हो रहा है…</p>
    <div id="error-box" style="display:none; margin-top:20px; padding:15px; background:#ffebee; color:#c62828; border-radius:8px; font-size:14px; text-align:left;"></div>
  </div>
</div>
<div id="toast"></div>

<!-- Global Error Logger (Pura Sach Dikhega) -->
<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  var errBox = document.getElementById('error-box');
  var loadText = document.getElementById('loading-text');
  if (errBox) {
    errBox.style.display = 'block';
    errBox.innerHTML = '<b>त्रुटि (Error):</b> ' + msg + '<br><small>फ़ाइल: ' + (url ? url.split('/').pop() : 'inline') + ' (Line: ' + lineNo + ')</small>';
  }
  if (loadText) loadText.style.display = 'none';
  return false;
};
</script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Helper Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Application Scripts -->
<script src="./config.js"></script>
<script src="./preset_parties.js"></script>
<script src="./calc.js"></script>
<script src="./views2.js"></script>
<script src="./app.js"></script>

<script>
// Force Check: Agar 4 second tak app load na ho toh check karein
setTimeout(function() {
  var appDiv = document.getElementById('app');
  if (document.getElementById('loading-text') && document.getElementById('loading-text').style.display !== 'none') {
    if (typeof window.renderLogin === 'function') {
      window.renderLogin();
    } else if (typeof renderLogin === 'function') {
      renderLogin();
    }
  }
}, 3000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function() {});
}
</script>
</body>
</html>

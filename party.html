<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>माज़दा पार्टी पोर्टल</title>

  <link rel="manifest" href="./party_manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mazda Party">
  <meta name="theme-color" content="#0a2f6b">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <!-- Fonts for Premium Look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    /* Premium Party Portal CSS (Isolated) */
    :root {
      --navy: #0a2f6b;
      --gold: #f4b41a;
      --dark: #0f172a;
      --glass: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
      background: linear-gradient(135deg, #04091a 0%, #0a1830 50%, #0d2a66 100%);
      background-attachment: fixed;
      color: #fff; min-height: 100vh; overflow-x: hidden;
    }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Page Transitions */
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* Glassmorphism Cards */
    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 16px; margin: 0 16px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative; overflow: hidden;
    }
    .glass-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    }

    /* Text & Colors */
    .text-gold { color: var(--gold); }
    .text-mut { color: #9aa5bb; font-size: 13px; }
    h2, h3 { margin: 0 0 8px; font-weight: 700; }
    .balance-big { font-size: 36px; font-weight: 800; font-family: 'Poppins', sans-serif; margin: 4px 0; }

    /* Header */
    .p-header {
      padding: calc(20px + env(safe-area-inset-top)) 16px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .p-header img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold); }
    
    /* Bottom Nav */
    .p-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 100; border-radius: 24px 24px 0 0;
    }
    .p-nav button {
      background: none; border: none; color: #64748b; font-family: inherit; font-size: 11px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: all 0.3s ease;
    }
    .p-nav button svg { width: 24px; height: 24px; transition: transform 0.3s; }
    .p-nav button.active { color: var(--gold); }
    .p-nav button.active svg { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 0 8px rgba(244,180,26,0.5)); }

    /* Inputs & Buttons */
    input {
      width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.2); color: #fff; font-family: inherit; font-size: 16px;
      text-align: center; letter-spacing: 4px; font-weight: bold; transition: 0.3s;
    }
    input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(244,180,26,0.2); }
    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(180deg, var(--gold) 0%, #d99700 100%);
      color: #000; font-family: inherit; font-weight: 800; font-size: 16px;
      box-shadow: 0 6px 20px rgba(244,180,26,0.3); transition: 0.2s;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }

    /* Login Screen Specifics */
    .login-screen { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-logo { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px; display: block; border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(244,180,26,0.4); }

    /* Animations */
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* Utility */
    .row { display: flex; gap: 10px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .hide { display: none !important; }
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #fff; color: #000; padding: 10px 20px; border-radius: 99px; font-weight: 600; font-size: 14px; z-index: 999; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="app">
    <!-- Content injected by party_portal.js -->
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;">
      <div style="width:50px;height:50px;border:4px solid rgba(255,255,255,0.1);border-top-color:#f4b41a;border-radius:50%;" class="spin"></div>
      <p class="text-mut" style="margin-top:16px;">लोड हो रहा है…</p>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Scripts -->
  <script src="./config.js"></script>
  <script src="./calc.js"></script>
  <script src="./party_portal.js"></script>
</body>
</html>
